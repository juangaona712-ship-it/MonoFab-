site_name: Diseño de PCB
site_description: Documentación técnica del diseño y ruteo de circuito impreso.
site_author: Juan Manuel Gaona Serrano

repo_url: https://github.com/juangaona712-ship-it/MonoFab-.git
repo_name: juangaona712-ship-it/MonoFab

# Menú agrupado para forzar las pestañas superiores modernas
nav:
  - Inicio: index.md
  - Kicad:
    - 1. Diseño del Esquemático: esquematico.md
    - 2. Editor de Placas (Layout): editor-placas.md
  - Mods: 
    - 3. Mods CE y Ajustes: mods-ce.md
  - MonoFab:
    - 4. MonoFab: monoFab.md
  - Multisim:
    - 5. Multisim: multisim.md
  - Referencias: recursos.md

theme:
  name: material
  logo: img/logo.jpg
  favicon: material/developer-board
  icon:
    repo: fontawesome/brands/github
  # Tipografía súper moderna y limpia
  font:
    text: Montserrat
    code: Fira Code
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs 
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    # Nota: Se eliminó 'navigation.expand' para que los menús estén colapsados por defecto.
    # Nota: Se eliminó 'toc.integrate' para limpiar los subtítulos de la barra izquierda y pasarlos a la derecha.
    
  # Paleta de colores: Tonos grises modernos y limpios
  palette:
    # Modo Claro (Gris azulado)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    
    # Modo Oscuro (Gris profundo moderno)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences

# Aquí llamamos a nuestro archivo de estilos personalizados
extra_css:
  - stylesheets/custom.css
